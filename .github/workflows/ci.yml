name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.execute-api.ap-south-2.amazonaws.com/prod/
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ap-south-2_EXAMPLE
          NEXT_PUBLIC_COGNITO_CLIENT_ID: exampleclientid
          NEXT_PUBLIC_AWS_REGION: ap-south-2
          NEXT_PUBLIC_DEMO_MODE: "true"

  backend:
    name: Backend package + SAM validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-lambda.txt -r requirements.txt
          pip install "aws-sam-cli>=1.120.0" pytest
        env:
          PIP_PREFER_BINARY: "1"
      - name: Build Lambda asset
        run: python cdk/build_lambda.py
        env:
          PIP_PREFER_BINARY: "1"
      - name: Validate SAM template
        working-directory: infra/demo
        run: sam validate --template template.yaml --region ap-south-2
        env:
          SAM_CLI_TELEMETRY: "0"
          AWS_DEFAULT_REGION: ap-south-2
      - name: Pytest (services)
        run: python -m pytest services -q --tb=line
